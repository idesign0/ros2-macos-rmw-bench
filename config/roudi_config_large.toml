# iox-roudi -c config/roudi_config_large.toml
# Default RouDi pools stop at 4 MB chunks; a chunk also holds a header, so a 4 MB
# message needs a bigger chunk. Without a fitting chunk, publish() blocks.
[general]
version = 1

[[segment]]

[[segment.mempool]]
size = 128
count = 10000

[[segment.mempool]]
size = 1024
count = 5000

[[segment.mempool]]
size = 16384
count = 1000

[[segment.mempool]]
size = 131072
count = 200

[[segment.mempool]]
size = 524288
count = 50

[[segment.mempool]]
size = 1048576
count = 30

[[segment.mempool]]
size = 4194304
count = 10

[[segment.mempool]]
size = 8388608
count = 32
